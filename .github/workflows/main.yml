name: run-bot
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"   # bot band ho jaye to naya run utha deta hai

permissions:
  contents: read

concurrency:
  group: toonflix-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start Cloudflare quick tunnel
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate > tunnel.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -z "$URL" ] && { echo "Tunnel URL nahi mila"; cat tunnel.log; exit 1; }
          echo "ORIGIN_URL=$URL" >> $GITHUB_ENV
      - name: Run bot (crash par same run me restart)
        run: |
          set +e
          for i in $(seq 1 20); do
            python main.py
            code=$?
            [ $code -eq 0 ] && exit 0
            echo "Bot crash (exit $code) - 5s me dobara ($i/20)"
            sleep 5
          done
          exit 1
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STORAGE_CHANNEL: ${{ secrets.STORAGE_CHANNEL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}      # tumhare Worker ka fixed URL
          PORT: "8000"
